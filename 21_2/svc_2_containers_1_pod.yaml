apiVersion: v1
kind: Service
metadata:
  name: skv-deploy-4-fix-svc
  labels:
    role: den-4-fix
    app: 4-fix
    organization: netology-fops40
    creator: denskv
spec:
  type: ClusterIP
  selector:
    app: nginx-multitool
  ports:
    - name: nginx
      protocol: TCP
      port: 80
      targetPort: 80

    - name: multitool-http
      protocol: TCP
      port: 1180
      targetPort: 1180

    - name: multitool-https
      protocol: TCP
      port: 11443
      targetPort: 11443
