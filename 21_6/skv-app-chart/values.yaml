replicaCount: 3

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Конфигурация компонента Nginx
nginx:
  name: nginx
  image:
    repository: nginx
    pullPolicy: IfNotPresent
    tag: "denskv"
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources: {}

# Конфигурация компонента MultiTool
multitool:
  name: multitool
  image:
    repository: wbitt/network-multitool
    pullPolicy: IfNotPresent
    tag: "denskv"
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  env:
    - name: HTTP_PORT
      value: "8080"
  resources: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
