apiVersion: v1
kind: Service
metadata:
  name: teamspeak6-ext
  namespace: ts6
spec:
  type: NodePort
  selector:
    app: teamspeak6
  ports:
    - name: voice
      port: 9987
      targetPort: 9987
      protocol: UDP
      nodePort: 30087
    - name: file-transfer
      port: 30033
      targetPort: 30033
      protocol: TCP
      nodePort: 30033