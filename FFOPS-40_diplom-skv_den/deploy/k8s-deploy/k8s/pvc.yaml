# PersistentVolumeClaim для данных стека ts6 
# StorageClass local-path встроен в k3s
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ts6-data
  namespace: ts6
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ts6-backend-data
  namespace: ts6
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ts6-music-data
  namespace: ts6
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi