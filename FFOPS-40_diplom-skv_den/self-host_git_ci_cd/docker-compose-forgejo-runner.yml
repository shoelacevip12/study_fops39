include:
  - docker-compose-forgejo.yml
services:
  docker-in-docker:
    image: docker:dind
    depends_on:
      server:
        condition: service_started
    container_name: 'docker_dind'
    privileged: 'true'
    command:
      - 'dockerd'
      - '-H'
      - 'tcp://0.0.0.0:2375'
      - '--tls=false'
      - '--insecure-registry=10.8.0.1:3000'
      - '--insecure-registry=git.den-skv.ru:3000'
    extra_hosts:
      - 'git.den-skv.ru:10.8.0.1'
    restart: 'unless-stopped'

  runner:
    image: 'data.forgejo.org/forgejo/runner:13'
    extra_hosts:
      - 'git.den-skv.ru:10.8.0.1'
    container_name: 'runner'
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    user: '0:0'
    volumes:
      - ~/data-runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: 'unless-stopped'
    command: 'forgejo-runner daemon --config /data/runner-config.yml'
